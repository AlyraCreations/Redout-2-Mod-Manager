name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      # CodeQL traces this build to see the compiled code (Windows Forms needs a Windows runner).
      - name: Build
        run: dotnet build R2MM.csproj -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
